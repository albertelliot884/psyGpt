<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>测试卷中心 - 心理学考研复习系统</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./psy.css" />
</head>
<body data-page="papers">
  <div class="shell">
    <header class="topbar card compact-topbar">
      <div>
        <div class="eyebrow">Papers</div>
        <h1>测试卷中心</h1>
        <p class="muted">当前提供章节卷、高频冲刺卷、真题风格卷的首版样板，用于跑通测试系统 MVP。</p>
      </div>
      <nav class="nav">
        <a class="nav-link" href="./psy-index.html">首页</a>
        <a class="nav-link" href="./psy-subject.html?subject=general_psychology">学科复习</a>
        <a class="nav-link active" href="./psy-papers.html">测试卷中心</a>
        <a class="nav-link" href="./psy-progress.html">复习进度</a>
        <a class="nav-link" href="./psy-manage.html">内容管理</a>
        <a class="nav-link" href="./psy-readme.html">使用说明</a>
      </nav>
    </header>

    <section class="card two-col">
      <div>
        <div class="eyebrow">Generator</div>
        <h2>快速组卷</h2>
        <div class="form-grid">
          <label>
            <span>卷子类型</span>
            <select id="paperType">
              <option value="chapter">章节卷</option>
              <option value="high">高频冲刺卷</option>
              <option value="mock">真题风格卷</option>
            </select>
          </label>
          <label>
            <span>学科</span>
            <select id="paperSubject"></select>
          </label>
          <label>
            <span>章节范围</span>
            <select id="paperChapter"></select>
          </label>
          <label>
            <span>难度</span>
            <select id="paperDifficulty">
              <option value="all">全部</option>
              <option value="easy">基础</option>
              <option value="medium">中等</option>
              <option value="hard">提升</option>
            </select>
          </label>
          <label>
            <span>题型模式</span>
            <select id="paperMode">
              <option value="mixed">混合组卷</option>
              <option value="objective">只要客观题</option>
              <option value="subjective">只要主观题</option>
            </select>
          </label>
          <label>
            <span>题量</span>
            <select id="paperCount">
              <option value="4">4 题</option>
              <option value="6" selected>6 题</option>
              <option value="8">8 题</option>
            </select>
          </label>
        </div>
        <div class="cta-row">
          <button class="cta primary" id="generatePaperBtn">生成试卷</button>
        </div>
      </div>
      <div class="panel">
        <div class="eyebrow">Guide</div>
        <h3>当前策略</h3>
        <ul class="bullet-list">
          <li>章节卷：优先从指定章节中抽取，可配合难度与题型模式筛选。</li>
          <li>高频冲刺卷：优先抽取高频题与核心题，适合快速刷重点。</li>
          <li>真题风格卷：混合主观题与客观题，更接近综合训练状态。</li>
        </ul>
      </div>
    </section>

    <section class="card">
      <div class="section-head"><div><div class="eyebrow">Generated Paper</div><h3>生成结果</h3></div></div>
      <div class="stack" id="paperResult"></div>
    </section>
  </div>
  <script src="./psy-app.js"></script>
</body>
</html>
