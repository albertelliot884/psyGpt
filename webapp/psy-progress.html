<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>复习进度 - 心理学考研复习系统</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./psy.css" />
</head>
<body data-page="progress">
  <div class="shell">
    <header class="topbar card compact-topbar">
      <div>
        <div class="eyebrow">Progress</div>
        <h1>复习进度</h1>
        <p class="muted">当前版本使用本地存储记录章节状态、最近生成试卷和薄弱标记，先跑通基础进度链路。</p>
      </div>
      <nav class="nav">
        <a class="nav-link" href="./psy-index.html">首页</a>
        <a class="nav-link" href="./psy-subject.html?subject=general_psychology">学科复习</a>
        <a class="nav-link" href="./psy-papers.html">测试卷中心</a>
        <a class="nav-link active" href="./psy-progress.html">复习进度</a>
        <a class="nav-link" href="./psy-manage.html">内容管理</a>
        <a class="nav-link" href="./psy-readme.html">使用说明</a>
      </nav>
    </header>

    <section class="card">
      <div class="section-head"><div><div class="eyebrow">Overview</div><h3>总体概览</h3></div></div>
      <div class="stats-grid" id="progressStats"></div>
    </section>

    <section class="card two-col">
      <div>
        <div class="section-head"><div><div class="eyebrow">Chapters</div><h3>章节状态</h3></div></div>
        <div class="stack" id="progressChapterList"></div>
      </div>
      <div>
        <div class="section-head"><div><div class="eyebrow">Weakness</div><h3>薄弱与建议</h3></div></div>
        <div class="stack" id="weaknessList"></div>
      </div>
    </section>

    <section class="card two-col">
      <div>
        <div class="section-head"><div><div class="eyebrow">Paper History</div><h3>最近组卷记录</h3></div></div>
        <div class="stack" id="paperHistoryList"></div>
      </div>
      <div>
        <div class="section-head"><div><div class="eyebrow">Coverage</div><h3>章节题型覆盖</h3></div></div>
        <div class="stack" id="coverageList"></div>
      </div>
    </section>

    <section class="card two-col">
      <div>
        <div class="section-head"><div><div class="eyebrow">Wrong Questions</div><h3>错题本概览</h3></div></div>
        <div class="stack" id="wrongQuestionSummary"></div>
      </div>
      <div>
        <div class="section-head"><div><div class="eyebrow">Wrong Question List</div><h3>错题列表</h3></div></div>
        <div class="stack" id="wrongQuestionList"></div>
      </div>
    </section>
  </div>
  <script src="./psy-app.js"></script>
</body>
</html>
