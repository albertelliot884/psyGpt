<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>内容管理 - 心理学考研复习系统</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./psy.css" />
</head>
<body data-page="manage">
  <div class="shell">
    <header class="topbar card compact-topbar">
      <div>
        <div class="eyebrow">Manage</div>
        <h1>内容管理</h1>
        <p class="muted">本地版增删改查工具。用于维护重点与题目数据，所有修改默认写入浏览器本地存储，可导出为 JSON 备份。</p>
      </div>
      <nav class="nav">
        <a class="nav-link" href="./psy-index.html">首页</a>
        <a class="nav-link" href="./psy-subject.html?subject=general_psychology">学科复习</a>
        <a class="nav-link" href="./psy-papers.html">测试卷中心</a>
        <a class="nav-link" href="./psy-progress.html">复习进度</a>
        <a class="nav-link active" href="./psy-manage.html">内容管理</a>
        <a class="nav-link" href="./psy-readme.html">使用说明</a>
      </nav>
    </header>

    <section class="card two-col">
      <div>
        <div class="eyebrow">Dataset</div>
        <h2>数据集操作</h2>
        <div class="cta-row">
          <button class="cta primary" id="exportDataBtn">导出本地数据</button>
          <button class="cta secondary" id="resetManageDataBtn">重置为默认数据</button>
        </div>
        <div class="form-grid" style="margin-top:16px;">
          <label>
            <span>导入 JSON</span>
            <input type="file" id="importDataInput" accept="application/json" />
          </label>
          <label>
            <span>管理类型</span>
            <select id="manageType">
              <option value="questions">题目</option>
              <option value="focus">重点</option>
              <option value="confusion">易混点</option>
            </select>
          </label>
        </div>
      </div>
      <div class="panel">
        <div class="eyebrow">Filters</div>
        <h3>筛选条件</h3>
        <div class="form-grid">
          <label>
            <span>学科</span>
            <select id="manageSubject"></select>
          </label>
          <label>
            <span>章节</span>
            <select id="manageChapter"></select>
          </label>
          <label>
            <span>关键词</span>
            <input type="text" id="manageKeyword" placeholder="标题 / 题干 / 摘要" />
          </label>
        </div>
      </div>
    </section>

    <section class="card manage-layout">
      <div class="manage-editor">
        <div class="section-head"><div><div class="eyebrow">Editor</div><h3 id="manageEditorTitle">新增题目</h3></div></div>
        <form class="manage-form-grid" id="manageForm"></form>
        <div class="cta-row" style="margin-top:16px;">
          <button class="cta primary" id="saveManageBtn">保存</button>
          <button class="cta secondary" id="clearManageBtn">清空表单</button>
        </div>
      </div>
      <div class="manage-list-panel">
        <div class="section-head"><div><div class="eyebrow">List</div><h3>当前数据</h3></div></div>
        <div class="stack" id="manageList"></div>
      </div>
    </section>
  </div>
  <script src="./psy-app.js"></script>
</body>
</html>
